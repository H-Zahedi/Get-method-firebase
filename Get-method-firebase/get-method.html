<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users List</title>

    <link rel="stylesheet" href="get-method.css">
</head>

<body>

    <!-- Delete Modal -->
    <div class="modal-container" id="delete-modal">
        <div class="modal-content">

            <h1 class="modal-title">
                Are you sure you want to delete this user?
            </h1>

            <div class="btn-groups">
                <button
                    type="button"
                    class="unaccept-btn"
                    id="cancel-delete-btn">
                    No
                </button>

                <button
                    type="button"
                    class="accept-btn"
                    id="confirm-delete-btn">
                    Yes
                </button>
            </div>

        </div>
    </div>


    <!-- Page title -->
    <h1 class="user-title">
        All Users That You Fetched
    </h1>


    <!-- Users -->
    <div id="wrap-users">

        <h2 class="loading">
            Loading users...
        </h2>

    </div>


    <script src="get-method.js"></script>

</body>
</html>
